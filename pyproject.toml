[project]
name = "idea"
version = "0.3.0"
description = "IDEA: Autonomous research loop — Idea, Deep research, Experiment, Analyze"
readme = "README.md"
authors = [
    { name = "Serrano", email = "cserrano@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.79",
]

[project.scripts]
idea = "idea.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idea"]

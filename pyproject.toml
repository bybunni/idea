[project]
name = "idea"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Serrano", email = "cserrano@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click",
    "rich",
    "anthropic",
]

[project.scripts]
